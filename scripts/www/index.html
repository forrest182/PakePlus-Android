<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9efe6">
<title>课本组 · 离线背单词</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#e9efe6;
    --card:#fdfcf6;
    --ink:#2f3b33;
    --ink-soft:#5c6b60;
    --line:#d8e0d2;
    --green:#4a7c59;
    --green-d:#3a6347;
    --green-soft:#e3ede2;
    --orange:#c77a35;
    --orange-soft:#f7e9da;
    --shadow:0 6px 20px rgba(60,80,60,.12);
  }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex; justify-content:center;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  .app{
    width:100%; max-width:560px;
    min-height:100%;
    display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 12px);
    gap:10px;
  }

  /* header */
  header{ display:flex; align-items:baseline; justify-content:space-between; padding:2px 4px; }
  header h1{ font-size:19px; font-weight:700; letter-spacing:.5px; color:var(--green-d); }
  .counter{ font-size:14px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .counter b{ color:var(--green-d); font-size:17px; }

  /* progress */
  .progress-wrap{ background:var(--card); border-radius:14px; padding:10px 12px; box-shadow:var(--shadow); }
  .progress-bar{ height:10px; background:#e2e8dd; border-radius:999px; overflow:hidden; }
  .progress-fill{ height:100%; width:0%;
    background:linear-gradient(90deg,#6f9d7a,#4a7c59); border-radius:999px; transition:width .3s ease; }
  .progress-meta{ display:flex; justify-content:space-between; margin-top:7px; font-size:12.5px; color:var(--ink-soft); }
  .progress-meta .m-dot{ color:var(--green-d); font-weight:600; }
  .progress-meta .r-dot{ color:var(--orange); font-weight:600; }

  /* filters */
  .filters{ background:var(--card); border-radius:14px; padding:10px 10px 8px; box-shadow:var(--shadow); }
  .filters-head{ display:flex; align-items:center; justify-content:space-between; padding:0 4px 6px; }
  .filters-head .t{ font-size:13px; font-weight:600; color:var(--ink-soft); }
  .filters-head .q{ font-size:12.5px; color:var(--green); background:var(--green-soft); border:none;
    padding:4px 10px; border-radius:999px; min-height:auto; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    border:1.5px solid var(--line); background:#f4f7f1; color:var(--ink-soft);
    font-size:13.5px; padding:7px 12px; border-radius:999px; min-height:38px;
    display:inline-flex; align-items:center; gap:5px; transition:all .15s;
  }
  .chip .n{ font-size:11.5px; opacity:.7; font-variant-numeric:tabular-nums; }
  .chip.on{ background:var(--green); border-color:var(--green); color:#fff; }
  .chip.on .n{ opacity:.85; }

  /* mode row */
  .mode-row{ display:flex; gap:8px; }
  .mode-row button{
    flex:1; min-height:40px; border-radius:11px; border:1.5px solid var(--line);
    background:var(--card); color:var(--ink-soft); font-size:13px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:4px;
  }
  .mode-row button.active{ background:var(--green-soft); border-color:var(--green); color:var(--green-d); }

  /* card */
  .card-stage{ flex:1; min-height:280px; perspective:1600px; display:flex; }
  .card{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.4,.2,.2,1); cursor:pointer; }
  .card.flipped{ transform:rotateY(180deg); }
  .card-face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--card); border-radius:20px; box-shadow:var(--shadow);
    padding:22px 20px; display:flex; flex-direction:column; align-items:center; text-align:center;
    overflow:auto;
  }
  .card-front{ z-index:2; }
  .card-back{ transform:rotateY(180deg); z-index:1; }
  .card.flipped .card-front{ z-index:1; }
  .card.flipped .card-back{ z-index:2; }
  .badge{
    position:absolute; top:14px; right:14px; font-size:12px; font-weight:600;
    padding:4px 10px; border-radius:999px;
  }
  .badge.mastered{ background:var(--green-soft); color:var(--green-d); }
  .badge.review{ background:var(--orange-soft); color:var(--orange); }
  .front-word{ font-size:clamp(34px,9vw,52px); font-weight:700; margin:auto 0 6px; word-break:break-word; letter-spacing:.5px; }
  .front-sub{ font-size:13.5px; color:var(--ink-soft); margin-bottom:auto; }
  .tap-hint{ margin-top:auto; font-size:12.5px; color:#9aa89c; padding-top:10px; }
  .back-phon{ font-size:clamp(20px,5.4vw,27px); color:var(--green-d); font-weight:600; margin-top:6px; }
  .back-pos{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:14px 0 4px; }
  .back-pos span{ font-size:12.5px; background:var(--green-soft); color:var(--green-d); padding:3px 10px; border-radius:999px; }
  .back-mean{
    font-size:clamp(16px,4.4vw,19px); line-height:1.75; color:var(--ink);
    white-space:pre-line; margin-top:12px; width:100%;
  }
  .no-phon{ font-size:14px; color:#aeb8ad; }

  /* mark row */
  .mark-row{ display:flex; gap:10px; }
  .mark-row button{
    flex:1; min-height:50px; border-radius:14px; font-size:15.5px; font-weight:600;
    border:1.5px solid var(--line); background:var(--card); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  #masterBtn.on{ background:var(--green); border-color:var(--green); color:#fff; }
  #reviewBtn.on{ background:var(--orange); border-color:var(--orange); color:#fff; }

  /* nav row */
  .nav-row{ display:flex; gap:10px; }
  .nav-row button{
    flex:1; min-height:54px; border-radius:14px; border:none; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:4px;
  }
  #prevBtn,#nextBtn{ background:var(--green); color:#fff; box-shadow:0 4px 12px rgba(74,124,89,.28); }
  #prevBtn:active,#nextBtn:active{ background:var(--green-d); }
  #flipBtn{ flex:0 0 84px; background:var(--green-soft); color:var(--green-d); }
  button:disabled{ opacity:.4; box-shadow:none; }

  /* empty state */
  .empty{
    flex:1; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:var(--card); border-radius:20px; box-shadow:var(--shadow); gap:12px; color:var(--ink-soft);
    text-align:center; padding:30px;
  }
  .empty.show{ display:flex; }
  .empty .big{ font-size:40px; }
  .empty p{ font-size:15px; line-height:1.6; }
  .empty button{ margin-top:6px; min-height:46px; padding:0 26px; border-radius:12px; border:none;
    background:var(--green); color:#fff; font-size:15px; font-weight:600; }

  .toast{
    position:fixed; left:50%; bottom:18%; transform:translateX(-50%) translateY(20px);
    background:rgba(47,59,51,.92); color:#fff; padding:10px 20px; border-radius:999px;
    font-size:14px; opacity:0; pointer-events:none; transition:all .25s; z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>课本组 · 四六级考研词汇</h1>
    <div class="counter"><b id="cur">1</b> / <span id="total">0</span></div>
  </header>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-meta">
      <span class="m-dot">已掌握 <span id="masteredCount">0</span></span>
      <span class="r-dot">待复习 <span id="reviewCount">0</span></span>
    </div>
  </div>

  <div class="filters">
    <div class="filters-head">
      <span class="t">按词性筛选</span>
      <button class="q" id="selectAllBtn">全选</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="mode-row">
    <button id="modeBtn">A-Z 顺序</button>
    <button id="reshuffleBtn">重新乱序</button>
    <button id="clearMarkBtn">清除标记</button>
  </div>

  <div class="card-stage" id="stage">
    <div class="card" id="card">
      <div class="card-face card-front">
        <span class="badge" id="frontBadge"></span>
        <div class="front-word" id="wordEl"></div>
        <div class="front-sub" id="frontSub"></div>
        <div class="tap-hint">点击卡片看释义 · 左右滑动切换</div>
      </div>
      <div class="card-face card-back">
        <span class="badge" id="backBadge"></span>
        <div class="back-phon" id="phonEl"></div>
        <div class="back-pos" id="posEl"></div>
        <div class="back-mean" id="meanEl"></div>
        <div class="tap-hint">点击返回正面</div>
      </div>
    </div>
    <div class="empty" id="empty">
      <div class="big">🗂️</div>
      <p>当前筛选条件下没有单词<br>请至少勾选一个词性</p>
      <button id="emptyBtn">全部勾选</button>
    </div>
  </div>

  <div class="mark-row">
    <button id="masterBtn">✓ 已掌握</button>
    <button id="reviewBtn">☆ 待复习</button>
  </div>

  <div class="nav-row">
    <button id="prevBtn">‹ 上一个</button>
    <button id="flipBtn">翻转</button>
    <button id="nextBtn">下一个 ›</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ========== 内置词库（7899词，字段：word / usPhonetic / pos / chineseMean） ========== */
const WORDS = [{"word":"abandon","usPhonetic":"ə'bændən","pos":["名词","动词"],"chineseMean":"n. 狂热，放任\nvt. 遗弃，放弃"},{"word":"abbreviation","usPhonetic":"əˌbriːvi'eɪʃn","pos":["名词"],"chineseMean":"n. 缩写"},{"word":"abide","usPhonetic":"ə'baɪd","pos":["动词"],"chineseMean":"vt. 忍受，容忍；停留\nvi. 持续；停留；忍受"},{"word":"ability","usPhonetic":"ə'bɪləti","pos":["名词"],"chineseMean":"n. 能力，能耐；才能"},{"word":"able","usPhonetic":"'eɪbl","pos":["形容词"],"chineseMean":"adj. 能干的；有能力的；能"},{"word":"abnormal","usPhonetic":"æb'nɔːrml","pos":["形容词"],"chineseMean":"adj. 反常的，不规则的；变态的"},{"word":"aboard","usPhonetic":"ə'bɔːrd","pos":["副词","介词"],"chineseMean":"adv. 在火车上；在飞机上；在船上\nprep. 在…上"},{"word":"abolish","usPhonetic":"ə'bɑːlɪʃ","pos":["动词"],"chineseMean":"vt. 废除，废止；取消，革除"},{"word":"abolition","usPhonetic":"ˌæbə'lɪʃn","pos":["名词"],"chineseMean":"n. 废除；废止"},{"word":"abort","usPhonetic":"ə'bɔːrt","pos":["动词"],"chineseMean":"vi. 流产；夭折；发育不全；堕胎\nvt. 使流产；使中止"},{"word":"abortion","usPhonetic":"ə'bɔːrʃn","pos":["名词"],"chineseMean":"n. 流产，小产；流产的胎儿"},{"word":"above","usPhonetic":"ə'bʌv","pos":["副词","介词"],"chineseMean":"prep. 在……上面；在……之上；超过\nadv. 在上面；在上文"},{"word":"abreast","usPhonetic":"ə'brest","pos":["形容词","副词"],"chineseMean":"adv. 并肩地；并列\nadj. 并排的；肩并肩的"},{"word":"abroad","usPhonetic":"ə'brɔːd","pos":["形容词","副词"],"chineseMean":"adv. 到海外；在国外\nadj. 往国外的"},{"word":"abrupt","usPhonetic":"ə'brʌpt","pos":["形容词"],"chineseMean":"adj. 突然的；唐突的；陡峭的；生硬的"},{"word":"absence","usPhonetic":"'æbsəns","pos":["名词"],"chineseMean":"n. 缺席；缺乏；没有；不注意"},{"word":"absent","usPhonetic":"'æbsənt","pos":["动词","形容词"],"chineseMean":"adj. 缺席的；缺少的；心不在焉的；茫然的\nvt. 使缺席"},{"word":"absolute","usPhonetic":"'æbsəluːt","pos":["名词","形容词"],"chineseMean":"adj. 绝对的；完全的；专制的\nn. 绝对事物；绝对"},{"word":"absorb","usPhonetic":"əb'zɔːrb","pos":["动词"],"chineseMean":"vt. 吸收；吸引；承受；理解；使…全神贯注"},{"word":"absorption","usPhonetic":"əb'zɔːrpʃn","pos":["名词"],"chineseMean":"n. 吸收，吸收作用；全神贯注，专心致志；合并；同化"},{"word":"abstract","usPhonetic":"'æbstrækt","pos":["名词","形容词"],"chineseMean const $ = id => document.getElementById(id);
function load(k, fallback){
  try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function save(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
let toastTimer=null;
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),1400);
}
const keyOf = w => w.toLowerCase();

/* ========== 构建学习队列 ========== */
function buildQueue(keepWord){
  let idxs = [];
  for(let i=0;i<WORDS.length;i++){
    if(WORDS[i].pos.some(p=>state.selected.has(p))) idxs.push(i);
  }
  if(state.mode==="random"){
    shuffle(idxs);
  }else{
    idxs.sort((a,b)=>{
      const x=WORDS[a].word.toLowerCase(), y=WORDS[b].word.toLowerCase();
      return x<y?-1:x>y?1:0;
    });
  }
  state.queue = idxs;
  // 定位
  let np = 0;
  if(keepWord!=null){
    const k=keepWord.toLowerCase();
    const found=idxs.findIndex(i=>keyOf(WORDS[i].word)===k);
    if(found>=0) np=found;
  }
  state.pos = Math.max(0, Math.min(np, idxs.length-1));
  if(idxs.length===0) state.pos=0;
}

/* ========== 渲染 ========== */
function counts(){
  let m=0,r=0;
  for(const k in state.status){
    if(state.status[k]==="mastered") m++;
    else if(state.status[k]==="review") r++;
  }
  return {m,r};
}

function render(){
  const empty = state.queue.length===0;
  $("empty").classList.toggle("show", empty);
  $("card").style.display = empty ? "none" : "";
  $("prevBtn").disabled = empty;
  $("nextBtn").disabled = empty;
  $("flipBtn").disabled = empty;
  $("masterBtn").disabled = empty;
  $("reviewBtn").disabled = empty;

  if(empty){
    $("total").textContent = "0"; $("cur").textContent = "0";
    $("progressFill").style.width="0%";
    const c=counts(); $("masteredCount").textContent=c.m; $("reviewCount").textContent=c.r;
    return;
  }

  const w = WORDS[state.queue[state.pos]];
  const st = state.status[keyOf(w.word)];

  // 正面
  $("wordEl").textContent = w.word;
  $("frontSub").textContent = w.pos.join(" · ");
  // 背面
  if(w.usPhonetic && w.usPhonetic.trim()){
    $("phonEl").textContent = "/ " + w.usPhonetic.trim() + " /";
    $("phonEl").classList.remove("no-phon");
  }else{
    $("phonEl").textContent = "（无音标）";
    $("phonEl").classList.add("no-phon");
  }
  $("posEl").innerHTML = "";
  w.pos.forEach(p=>{
    const s=document.createElement("span"); s.textContent=p; $("posEl").appendChild(s);
  });
  $("meanEl").textContent = w.chineseMean;

  // 角标
  ["frontBadge","backBadge"].forEach(bid=>{
    const b=$(bid); b.textContent=""; b.className="badge";
    if(st==="mastered"){ b.textContent="已掌握"; b.classList.add("mastered"); }
    else if(st==="review"){ b.textContent="待复习"; b.classList.add("review"); }
  });

  // 标记按钮高亮
  $("masterBtn").classList.toggle("on", st==="mastered");
  $("reviewBtn").classList.toggle("on", st==="review");

  // 计数 / 进度
  $("cur").textContent = state.pos+1;
  $("total").textContent = state.queue.length;
  const pct = ((state.pos+1)/state.queue.length)*100;
  $("progressFill").style.width = pct.toFixed(1)+"%";
  const c=counts();
  $("masteredCount").textContent=c.m;
  $("reviewCount").textContent=c.r;

  // 边界
  $("prevBtn").disabled = state.pos<=0;
  $("nextBtn").disabled = state.pos>=state.queue.length-1;

  // 翻回正面
  unflip();
  save(LS.progress, {word:w.word});
}

function flip(){
  if(state.queue.length===0) return;
  state.flipped=!state.flipped;
  $("card").classList.toggle("flipped", state.flipped);
}
function unflip(){
  state.flipped=false;
  $("card").classList.remove("flipped");
}

/* ========== 导航 ========== */
function go(delta){
  if(state.queue.length===0) return;
  const np = state.pos+delta;
  if(np<0){ toast("已经是第一个"); return; }
  if(np>state.queue.length-1){ toast("已经是最后一个"); return; }
  state.pos=np; render();
}

/* ========== 标记 ========== */
function mark(kind){
  if(state.queue.length===0) return;
  const w = WORDS[state.queue[state.pos]];
  const k = keyOf(w.word);
  if(state.status[k]===kind){ delete state.status[k]; toast("已取消标记"); }
  else{ state.status[k]=kind; toast(kind==="mastered"?"标记为已掌握":"标记为待复习"); }
  save(LS.status, state.status);
  render();
}

/* ========== 筛选 chips ========== */
function buildChips(){
  const wrap=$("chips"); wrap.innerHTML="";
  // 全库各词性数量
  const stat={}; POS_TYPES.forEach(p=>stat[p]=0);
  WORDS.forEach(w=>w.pos.forEach(p=>{ if(p in stat) stat[p]++; }));
  POS_TYPES.forEach(p=>{
    const b=document.createElement("button");
    b.className="chip"+(state.selected.has(p)?" on":"");
    const t=document.createElement("span"); t.textContent=p;
    const n=document.createElement("span"); n.className="n"; n.textContent=stat[p];
    b.appendChild(t); b.appendChild(n);
    b.addEventListener("click",()=>{
      if(state.selected.has(p)) state.selected.delete(p); else state.selected.add(p);
      persistSetting();
      const cur = state.queue.length?WORDS[state.queue[state.pos]].word:null;
      buildQueue(cur); render(); buildChips();
    });
    wrap.appendChild(b);
  });
  $("selectAllBtn").textContent = state.selected.size===POS_TYPES.length ? "全不选" : "全选";
}
function persistSetting(){
  save(LS.setting, {selected:[...state.selected], mode:state.mode});
}

/* ========== 事件绑定 ========== */
$("flipBtn").addEventListener("click", flip);
$("prevBtn").addEventListener("click", ()=>go(-1));
$("nextBtn").addEventListener("click", ()=>go(1));
$("masterBtn").addEventListener("click", ()=>mark("mastered"));
$("reviewBtn").addEventListener("click", ()=>mark("review"));

$("card").addEventListener("click", flip);

$("modeBtn").addEventListener("click", ()=>{
  state.mode = state.mode==="az" ? "random" : "az";
  $("modeBtn").classList.toggle("active", state.mode==="random");
  $("modeBtn").textContent = state.mode==="az" ? "A-Z 顺序" : "随机乱序";
  persistSetting();
  const cur = state.queue.length?WORDS[state.queue[state.pos]].word:null;
  buildQueue(cur); render();
  toast(state.mode==="az"?"已切换 A-Z 顺序":"已切换随机乱序");
});
$("reshuffleBtn").addEventListener("click", ()=>{
  if(state.mode!=="random"){
    state.mode="random";
    $("modeBtn").classList.add("active"); $("modeBtn").textContent="随机乱序";
    persistSetting();
  }
  const cur = state.queue.length?WORDS[state.queue[state.pos]].word:null;
  buildQueue(cur); render(); toast("已重新乱序");
});
$("clearMarkBtn").addEventListener("click", ()=>{
  state.status={}; save(LS.status, state.status); render(); toast("已清除全部掌握/复习标记");
});
$("selectAllBtn").addEventListener("click", ()=>{
  if(state.selected.size===POS_TYPES.length) state.selected.clear();
  else POS_TYPES.forEach(p=>state.selected.add(p));
  persistSetting(); buildChips();
  const cur = state.queue.length?WORDS[state.queue[state.pos]].word:null;
  buildQueue(cur); render();
});
$("emptyBtn").addEventListener("click", ()=>{
  POS_TYPES.forEach(p=>state.selected.add(p));
  persistSetting(); buildChips(); buildQueue(null); render();
});

/* ========== 触摸滑动（左右切换，点击翻转） ========== */
let sx=0, sy=0, sTime=0, swiping=false, suppressClick=false;
const stage=$("stage");
stage.addEventListener("touchstart", e=>{
  const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY; sTime=Date.now(); swiping=true;
}, {passive:true});
stage.addEventListener("touchend", e=>{
  if(!swiping) return; swiping=false;
  const t=e.changedTouches[0];
  const dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.2){
    suppressClick=true;
    go(dx<0?1:-1);
    setTimeout(()=>suppressClick=false,350);
  }
}, {passive:true});
$("card").addEventListener("click", e=>{ if(suppressClick){ e.stopImmediatePropagation(); return; } }, true);

/* ========== 初始化（恢复上次设置与进度） ========== */
(function init(){
  const st = load(LS.status, {});
  if(st && typeof st==="object") state.status=st;
  const setting = load(LS.setting, null);
  if(setting){
    if(Array.isArray(setting.selected) && setting.selected.length)
      state.selected = new Set(setting.selected.filter(p=>POS_TYPES.includes(p)));
    if(setting.mode==="random"||setting.mode==="az") state.mode=setting.mode;
  }
  $("modeBtn").classList.toggle("active", state.mode==="random");
  $("modeBtn").textContent = state.mode==="az" ? "A-Z 顺序" : "随机乱序";

  const prog = load(LS.progress, null);
  buildQueue(prog && prog.word ? prog.word : null);
  buildChips();
  render();
})();
</script>
